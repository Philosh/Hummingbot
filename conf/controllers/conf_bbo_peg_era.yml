id: bbo_peg_era_htx
controller_name: bbo_peg_buy
controller_type: market_making

connector_name: htx
trading_pair: ERA-USDT

# Single LIMIT_MAKER buy at external_best_bid + 1 tick (excluding our own
# resting order). Order size = this / quoted price.
total_amount_quote: 20

# Seconds between controller ticks. ERA runs at 1.0s (faster than the
# default 2.0s used by XNO/WAVES) to react more quickly to the leapfrog
# spoof pattern on this pair. Safe because cancel_debounce_seconds (2.0)
# is still longer than this interval — the walker still treats just-
# cancelled orders as ours through the WebSocket propagation lag, so the
# self-chase loop stays defused.
update_interval: 1.0

# Anti-spoof gate, calibrated for ERA's ~3.5% natural spread.
# Rule of thumb: gate ~60-70% of typical natural spread. 2.0% leaves ~1.5%
# headroom within normal market conditions and fires only on meaningful
# spread compression (i.e. real spoofing). If gate fires too often in calm
# markets, lower; if spoofs slip through, raise.
min_spread_pct: 0.020

# Same 2.0s cancel-debounce as XNO/WAVES — covers HTX cancel-WebSocket lag.
cancel_debounce_seconds: 2.0

# N-shot fill latch (1 = original one-shot behavior used by XNO and WAVES
# when those run). ERA gets 10 because its wider 3.5% natural spread and
# higher volume support sustained round-tripping. Each distinct executor
# counts once (partial fills don't inflate the count). After 10 fills, the
# controller stops creating new orders for the process lifetime.
max_fills: 10

# Cross-controller inventory cap. Buy is paused when (buys - sells) >= 5
# on this trading pair (counts tracked across both bbo_peg buy and sell
# controllers via the shared fill_tracker module). Effective behavior:
# - First 5 buys can fire back-to-back even with no sells (lead=0..5).
# - 6th buy waits for the 1st sell fill.
# - In general: buy N is allowed only when (filled buys - filled sells) < 5.
# Prevents the buy side from accumulating more than ~$100 of ERA inventory
# (5 × $20 quote) regardless of how slowly sells clear.
max_buy_lead: 5

manual_kill_switch: false
initial_positions: []

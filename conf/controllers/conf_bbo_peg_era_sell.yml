id: bbo_peg_era_htx_sell
controller_name: bbo_peg_sell
controller_type: market_making

connector_name: htx
trading_pair: ERA-USDT

# Single LIMIT_MAKER sell at external_best_ask - 1 tick (excluding our own
# resting order). Order size = this / quoted price. Requires base inventory
# (ERA) on the account to actually fill. Pre-flight balance guard skips the
# Create if insufficient and logs once per insufficient<->sufficient
# transition.
total_amount_quote: 20

# Same 2.0s tick interval as the buy side.
update_interval: 2.0

# Anti-spoof gate calibrated for ERA's ~3.5% natural spread (see the buy
# config for the rationale). Same threshold on both sides keeps behavior
# symmetric.
#
# NOTE: known cross-controller interaction (carried over from XNO). The
# gate references raw best_bid (not self-excluded), so the buy controller's
# own quote may compress the measured spread by 1 tick. With a 2.0%
# threshold and ERA's ~3.5% natural spread, there's a ~1.5% margin before
# that compression matters in normal markets.
min_spread_pct: 0.020

# Same 2.0s cancel-debounce as XNO/WAVES.
cancel_debounce_seconds: 2.0

# N-shot fill latch (see buy-side config for the rationale). Symmetric
# with the buy side so the sell controller can also re-quote up to 10 times,
# matching the buy-side allowance so inventory accumulated by repeated
# buys can be cleared.
max_fills: 10

manual_kill_switch: false
initial_positions: []

id: bbo_peg_flow_htx
controller_name: bbo_peg_buy
controller_type: market_making

connector_name: htx
trading_pair: FLOW-USDT

# Single LIMIT_MAKER buy at external_best_bid + 1 tick. $11 per side.
total_amount_quote: 11

# 3.0s tick.
update_interval: 3.0

# Anti-spoof gate for FLOW (~8% live spread, but earlier observed 2.5%).
# FLOW = Flow blockchain (NBA Top Shot, CryptoKitties).
# Set conservatively at 2.0% to handle the spread fluctuation observed
# between snapshots. With FLOW's clean 0.003% tick, even tight spreads
# capture nearly the full amount after the two tick deductions.
# WARNING: 24h volume is only $42k. Quotes may sit for a LONG time before
# any taker hits them. Don't expect frequent fills.
min_spread_pct: 0.020

cancel_debounce_seconds: 2.0
max_fills: 10
max_buy_lead: 1

manual_kill_switch: false
initial_positions: []

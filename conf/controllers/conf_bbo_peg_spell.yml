id: bbo_peg_spell_htx
controller_name: bbo_peg_buy
controller_type: market_making

connector_name: htx
trading_pair: SPELL-USDT

# Single LIMIT_MAKER buy at external_best_bid + 1 tick. $11 per side.
total_amount_quote: 11

update_interval: 3.0

# Anti-spoof gate. On 2026-05-29 SPELL showed ~1.3% spread on $142K 24h
# volume, deposit+withdraw open; gate set to 0.6%.
# SINGLE-SNAPSHOT ESTIMATE — re-tune live.
min_spread_pct: 0.006

cancel_debounce_seconds: 2.0
max_fills: 10

# Inventory-value cap: pause buys while base inventory (valued at mid) is
# >= this, resume once a sell clears it below.
max_inventory_quote: 10.1

manual_kill_switch: false
initial_positions: []

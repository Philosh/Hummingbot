id: bbo_peg_sundog_htx
controller_name: bbo_peg_buy
controller_type: market_making

connector_name: htx
trading_pair: SUNDOG-USDT

# Single LIMIT_MAKER buy at external_best_bid + 1 tick. Order size = this /
# quoted price. $11 per side to spread capital across WAVES + ACTSOL + SUNDOG.
total_amount_quote: 11

# Seconds between controller ticks. 1.0s for quicker reaction.
# cancel_debounce_seconds (2.0) still exceeds this interval so the walker
# continues to dedupe ghost cancels through the WebSocket propagation lag.
update_interval: 1.0

# Anti-spoof gate, calibrated for SUNDOG's ~2.8% live natural spread.
# Rule of thumb: gate ~60% of typical natural spread. SUNDOG is a Tron-
# ecosystem memecoin so spreads can shift quickly — paper-test and adjust
# if the gate flaps frequently.
min_spread_pct: 0.017

# Same 2.0s cancel-debounce — covers HTX cancel-WebSocket lag.
cancel_debounce_seconds: 2.0

# N-shot fill latch: 10 distinct fills per process before this side latches.
max_fills: 10

# Inventory cap: pause buys when (buys - sells) >= 1 on SUNDOG-USDT, so the
# buy side can't accumulate more than ~$11 of SUNDOG (1 × $11 quote).
max_buy_lead: 1

manual_kill_switch: false
initial_positions: []

id: bbo_peg_xno_htx
controller_name: bbo_peg_buy
controller_type: market_making

connector_name: htx
trading_pair: XNO-USDT

# Single LIMIT_MAKER buy at external_best_bid + 1 tick (excluding our own
# resting order). Order size = this / quoted price.
total_amount_quote: 20

# Seconds between controller ticks. Lower = faster reaction, more REST traffic.
# Bumped from 0.5 -> 2.0 to give the exchange order book WebSocket time to
# reflect our cancels before the next walker pass. With 0.5s, we observed a
# self-chase loop where our just-cancelled orders still showed in the book
# and the walker treated them as external bids -> chased ourselves up by 1
# tick repeatedly. 2s gives the cancel time to clear.
update_interval: 2.0

# Anti-spoof gate. Refuse to quote when the external market spread
# (best_ask - external_best_bid) / external_best_bid is below this.
# Default 0.02 = 2%.
min_spread_pct: 0.02

manual_kill_switch: false
initial_positions: []

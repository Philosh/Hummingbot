id: pmm_strx_htx
controller_name: pmm_simple
controller_type: market_making

# HTX spot — leverage=1 forces spot mode, position_mode unused on spot.
connector_name: htx
trading_pair: STRX-USDT
leverage: 1
position_mode: ONEWAY

# $40 split across both sides via amounts_pct (1:1 buy:sell -> $20 per side).
total_amount_quote: 40

# STRX market spread is ~4.2% — quote 2% off mid each way so we sit comfortably
# inside the market spread but still capture 4% round-trip minus 0.4% fee.
buy_spreads: [0.020]
sell_spreads: [0.020]
buy_amounts_pct: null
sell_amounts_pct: null

# Per-executor lifecycle.
executor_refresh_time: 30
cooldown_time: 60

# Triple barrier on each filled position.
# time_limit disabled — time_limit_order_type is hardcoded MARKET in the controller
# base, so a fired timer always dumps the position at market (fee + spread loss).
# For spot MM we want to hold inventory until the take_profit limit clears.
stop_loss: 0.30
take_profit: 0.020
time_limit: null
take_profit_order_type: LIMIT
trailing_stop: null

# Position management.
# skip_rebalance MUST be true for spot: PMM Simple is designed for perpetuals and
# will MARKET-buy inventory to a target mix at startup, then immediately MARKET-sell
# part of it because spot can't carry "short positions" the way the executor expects.
position_rebalance_threshold_pct: 0.05
skip_rebalance: true
manual_kill_switch: false
initial_positions: []

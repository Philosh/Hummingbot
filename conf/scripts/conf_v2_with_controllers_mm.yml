# Launcher config for v2_with_controllers.py.
# Running PYR + AUDIO + SIS on HTX (3 tokens, 6 controllers). Clean reset
# after multiple cycles of "screener-picks-then-collapse" (XMN/MIRA/A8).
# These three are picked from a user-curated list, all are HTX-status OK,
# and PYR + AUDIO have real-product fundamentals (Vulcan Forged gaming,
# Audius music streaming) — less likely to vanish in minutes than
# unfamiliar small-caps.
#
# Capital: ~$33 USDT open (3 × $11 buys), max ~$33 inventory
# (with max_buy_lead=1, each token caps at 1 × $11 unmatched).
#
# Per-token gate thresholds (min_spread_pct, calibrated ~60% of natural spread):
#   PYR    = 0.014 (live spread ~2.3%; clean 0.041% tick)
#   AUDIO  = 0.022 (live spread ~3.6%; chunky 0.52% tick)
#   SIS    = 0.030 (live spread ~5.2%; chunky 0.51% tick, highest-risk pick)
#
# Per-token max_fills (process-lifetime fill cap): all currently-enabled = 10
# Per-token max_buy_lead (inventory cap): all currently-enabled = 1
# (strict 1-for-1 pacing — buy must be matched by a sell before another buy)
script_file_name: v2_with_controllers.py
controllers_config:
  # All previously-deployed tokens paused below.
  # - conf_bbo_peg_xno.yml          # paused
  # - conf_bbo_peg_xno_sell.yml     # paused
  # - conf_bbo_peg_era.yml          # paused (spread compressed)
  # - conf_bbo_peg_era_sell.yml     # paused
  # - conf_bbo_peg_blue.yml         # paused (spread compressed)
  # - conf_bbo_peg_blue_sell.yml    # paused
  # - conf_bbo_peg_xmn.yml          # paused (edge collapsed)
  # - conf_bbo_peg_xmn_sell.yml     # paused
  # - conf_bbo_peg_vsn.yml          # paused (edge collapsed)
  # - conf_bbo_peg_vsn_sell.yml     # paused
  # - conf_bbo_peg_waves.yml        # paused (clean reset)
  # - conf_bbo_peg_waves_sell.yml   # paused
  # - conf_bbo_peg_sundog.yml       # paused
  # - conf_bbo_peg_sundog_sell.yml  # paused
  # - conf_bbo_peg_actsol.yml       # paused
  # - conf_bbo_peg_actsol_sell.yml  # paused
  # - conf_bbo_peg_a8.yml           # paused (gate-blocked since startup, no emits)
  # - conf_bbo_peg_a8_sell.yml      # paused
  # - conf_bbo_peg_ping.yml         # paused
  # - conf_bbo_peg_ping_sell.yml    # paused
  - conf_bbo_peg_pyr.yml
  - conf_bbo_peg_pyr_sell.yml
  - conf_bbo_peg_audio.yml
  - conf_bbo_peg_audio_sell.yml
  - conf_bbo_peg_sis.yml
  - conf_bbo_peg_sis_sell.yml

# Optional safety brakes (USDT). Comment out / set null to disable.
# max_controller_drawdown_quote stops a single controller if its drawdown from peak exceeds this.
# max_global_drawdown_quote stops EVERYTHING if total drawdown from peak exceeds this.
max_controller_drawdown_quote: null
max_global_drawdown_quote: null

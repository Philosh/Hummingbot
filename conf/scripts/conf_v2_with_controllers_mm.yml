# Launcher config for v2_with_controllers.py.
# Running WAVES + ACTSOL + SUNDOG on HTX (3 tokens, buy+sell each = 6 controllers).
# ERA + BLUE paused — both saw live spread compress below their break-even.
# All three active tokens use total_amount_quote=$11, max_fills=10, max_buy_lead=3
# (so max inventory accumulation per token ~$33; max across all three ~$99).
# Capital required: ~$33 USDT for open buy orders + base inventory headroom.
#
# Per-token gate thresholds (min_spread_pct, calibrated ~60% of natural spread):
#   WAVES   = 0.014 (live spread ~2%)
#   ACTSOL  = 0.025 (live spread ~4.2%)
#   SUNDOG  = 0.017 (live spread ~2.8%; Tron-ecosystem memecoin, watch volatility)
#
# Per-token max_fills (process-lifetime fill cap): all currently-enabled = 10
# Per-token max_buy_lead (inventory cap): all currently-enabled = 3
script_file_name: v2_with_controllers.py
controllers_config:
  # - conf_bbo_peg_xno.yml          # disabled
  # - conf_bbo_peg_xno_sell.yml     # disabled
  # - conf_bbo_peg_era.yml          # disabled (spread compressed below break-even)
  # - conf_bbo_peg_era_sell.yml     # disabled (spread compressed below break-even)
  # - conf_bbo_peg_blue.yml         # disabled (spread compressed from 4.3% to 1.8%)
  # - conf_bbo_peg_blue_sell.yml    # disabled (spread compressed from 4.3% to 1.8%)
  - conf_bbo_peg_waves.yml
  - conf_bbo_peg_waves_sell.yml
  - conf_bbo_peg_actsol.yml
  - conf_bbo_peg_actsol_sell.yml
  - conf_bbo_peg_sundog.yml
  - conf_bbo_peg_sundog_sell.yml

# Optional safety brakes (USDT). Comment out / set null to disable.
# max_controller_drawdown_quote stops a single controller if its drawdown from peak exceeds this.
# max_global_drawdown_quote stops EVERYTHING if total drawdown from peak exceeds this.
max_controller_drawdown_quote: null
max_global_drawdown_quote: null

# Launcher config for v2_with_controllers.py.
# Currently running ERA-USDT (buy + sell). XNO and WAVES configs remain
# commented. Both ERA controllers tick at 1.0s (faster than the 2.0s
# default) for quicker reaction to the leapfrog-spoof pattern.
#
# Per-token gate thresholds (min_spread_pct, calibrated ~60% of natural spread):
#   XNO   = 0.020 (natural ~1.5-2%)
#   WAVES = 0.014 (natural ~2.4%)
#   ERA   = 0.020 (natural ~3.5%)
#
# Per-token max_fills (process-lifetime fill cap):
#   XNO   = 1 (default; one-shot)
#   WAVES = 1 (default; one-shot)
#   ERA   = 10 (N-shot for sustained round-tripping)
#
# Per-token max_buy_lead (inventory cap; buys paused when ahead of sells):
#   XNO   = None (disabled)
#   WAVES = None (disabled)
#   ERA   = 5 (≤5 unmatched buys allowed at any time)
script_file_name: v2_with_controllers.py
controllers_config:
  # - conf_bbo_peg_xno.yml          # disabled
  # - conf_bbo_peg_xno_sell.yml     # disabled
  # - conf_bbo_peg_waves.yml        # disabled
  # - conf_bbo_peg_waves_sell.yml   # disabled
  - conf_bbo_peg_era.yml
  - conf_bbo_peg_era_sell.yml

# Optional safety brakes (USDT). Comment out / set null to disable.
# max_controller_drawdown_quote stops a single controller if its drawdown from peak exceeds this.
# max_global_drawdown_quote stops EVERYTHING if total drawdown from peak exceeds this.
max_controller_drawdown_quote: null
max_global_drawdown_quote: null
